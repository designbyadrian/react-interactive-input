name: Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Node 24 ships npm >= 11.5.1, required for OIDC publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # Never cache package manager state in release builds.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Test
        run: npm test

      # setup-node writes an empty _authToken placeholder when NODE_AUTH_TOKEN
      # is unset; that blocks the OIDC flow. Remove it so npm uses Trusted Publishing.
      - name: Prepare npmrc for OIDC publish
        run: |
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              sed -i '/_authToken/d' "$f"
            fi
          done

      - name: Dry-run publish
        run: npm publish --dry-run

      - name: Publish to npm
        run: npm publish

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy-storybook:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
